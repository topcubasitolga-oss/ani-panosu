<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anı Panosu</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one column of white cards on a pale blue board; a scrolling strip of sections on top */
  --night:#eef3f8;   /* board: cool morning light */
  --cloth:#1f2a44;   /* navy: buttons, active tab */
  --paper:#ffffff;   /* cards */
  --ink:#1f2a44;     /* text */
  --cap:#e5516b;     /* rose accent */
  --leaf:#3b8ea5;    /* teal secondary */
  --mist:#55627d;    /* quiet text on board */
  --font-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --font-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--mist);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cap);outline-offset:2px}
[hidden]{display:none !important}
img{max-width:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 96px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:26px 0 14px}
.brand .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--leaf);font-weight:600}
.brand h1{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:38px;line-height:1;margin:4px 0 0;color:var(--ink)}
.brand h1 b{font-style:normal;font-weight:500;color:var(--cap)}
.top a{font-size:13px;color:var(--mist);text-underline-offset:3px;white-space:nowrap}

nav.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:10px 16px;margin:0 -16px;background:var(--night);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;background:#fff;text-decoration:none;padding:8px 14px;border-radius:99px;border:1.5px solid #d3dce8;color:var(--mist);font-weight:600;font-size:15px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--cloth);border-color:var(--cloth);color:#fff}

.status{margin:10px 0;padding:10px 14px;border-radius:10px;background:#ffffff;border:1px solid #d3dce8;font-size:14px}
.day{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.day h2{font-family:var(--font-display);font-weight:500;font-size:22px;margin:0;color:var(--ink)}
.day span{font-size:13px;color:var(--leaf)}
.sec-hint{font-size:14px;margin:-4px 0 12px;color:var(--mist)}
.empty{padding:18px;border:1.5px dashed #d3dce8;border-radius:12px;font-size:15px}
.list{display:flex;flex-direction:column;gap:14px}

.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--cap);box-shadow:0 1px 2px rgba(31,42,68,.06),0 10px 28px rgba(31,42,68,.08)}
.card.yer,.card.lezzet{border-top-color:var(--leaf)}
.card.gun,.card.soz,.card.yapilacak{border-top-color:var(--cloth)}
.card .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.chip{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--cloth);color:var(--paper)}
.chip.c-cap{background:var(--cap);color:#fff}
.chip.c-leaf{background:var(--leaf);color:#fff}
.chip.c-line{background:transparent;color:var(--ink);border:1.5px solid rgba(31,42,68,.55)}
.chip.wish{background:transparent;color:var(--ink);border:1.5px dashed rgba(31,42,68,.5)}
.card h3{font-family:var(--font-display);font-weight:500;font-size:21px;line-height:1.15;margin:0;flex-basis:100%;text-wrap:balance}
.card.soz h3{font-family:var(--font-hand);font-weight:700;font-size:30px;line-height:1.05}
.meta{font-size:13px;color:rgba(31,42,68,.7)}
.count{font-family:var(--font-display);font-weight:500;font-size:17px;color:var(--cap)}
.photos{display:grid;gap:6px;grid-template-columns:1fr}
.photos.many{grid-template-columns:1fr 1fr}
.photos button{border:0;padding:0;background:none;border-radius:6px;display:block;cursor:zoom-in}
.photos img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#e6ecf3;border-radius:6px}
.photos.many img{aspect-ratio:1}
.note{font-family:var(--font-hand);font-size:23px;line-height:1.12;margin:0;white-space:pre-wrap}
.stars{display:flex;flex-direction:column;gap:4px;font-size:14px}
.stars .row{display:flex;align-items:center;gap:8px}
.stars .who{min-width:92px;color:rgba(31,42,68,.75)}
.stars button{border:0;background:none;padding:2px 3px;font-size:22px;line-height:1;color:rgba(31,42,68,.25)}
.stars button.on,.stars .ro b{color:var(--cap)}
.stars .ro{font-size:18px;letter-spacing:2px;color:rgba(31,42,68,.25)}
.stars .ro b{font-weight:400}
.comments{display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(31,42,68,.14);padding-top:10px}
.cm{font-size:15px}
.cm b{font-weight:600}
.cm time{font-size:12px;color:rgba(31,42,68,.55);margin-left:6px}
.cmform{display:flex;gap:6px}
.cmform input{flex:1;min-width:0;padding:9px 11px;border-radius:9px;border:1.5px solid rgba(31,42,68,.25);background:#ffffff;color:var(--ink)}
.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--cloth);color:var(--paper);font-weight:600;font-size:14px}
.btn.cap{background:var(--cap);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid rgba(31,42,68,.3)}
.btn.onboard{background:#fff;color:var(--mist);border:1.5px solid #d3dce8}
.btn.danger{background:#a3331a;color:#fff}
.btn:disabled{opacity:.55;cursor:progress}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acts .by{margin-right:auto;font-size:12px;color:rgba(31,42,68,.6)}
.acts .btn{padding:6px 10px;font-size:13px}

.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0}
.pager .btn{padding:10px 16px;font-size:15px;min-width:104px}
.pager .btn:disabled{opacity:.35;cursor:default}
.pager .mid{display:flex;flex-direction:column;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.pager .mid button{border:0;background:none;padding:2px 4px;font-size:12px;color:var(--leaf);text-decoration:underline;text-underline-offset:3px}
.card.page{touch-action:pan-y}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 button{border:0;padding:0;background:#dfe6ef;display:block;border-radius:8px;overflow:hidden}
.grid3 img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.card.planli{background-color:#fff4d1;border-top-color:#e9c46a}
.count.plan{align-self:flex-start;font-family:var(--font-body);font-weight:600;font-size:14px;color:#3d2c00;background:#e9c46a;border-radius:99px;padding:4px 12px}
.mapbox .pin.plan{fill:#e9c46a;stroke:#1c2a21}
.legend{display:flex;gap:14px;font-size:13px;margin:8px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--cap)}
.legend i.p{background:#e9c46a}
.xbtns{display:flex;gap:8px;margin-top:12px}
.xbtns .btn{padding:12px 20px;font-size:16px}
.together{margin-top:18px;padding:20px 22px;border-radius:16px;background:var(--cloth);color:#fff;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.together b{font-family:var(--font-display);font-weight:500;font-size:56px;line-height:.9;color:#ff9fb0;font-variant-numeric:tabular-nums}
.together span{font-size:15px}

.mapbox{margin-top:16px;border-radius:14px;overflow:hidden;background:#dbe9f4;border:1px solid #d3dce8}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapbox .sea{fill:#dbe9f4}
.mapbox .land{fill:#f9fbfd;stroke:#c3d2e0;stroke-width:.6;vector-effect:non-scaling-stroke}
.mapbox .home{fill:#ffe1e6;stroke:#e5516b;stroke-width:1;vector-effect:non-scaling-stroke}
.mapbox .pin{fill:var(--cap);stroke:#ffffff;stroke-width:1.5;vector-effect:non-scaling-stroke}
.mapbox .pin.sel{fill:#1f2a44;stroke:#ffffff;stroke-width:2.5}
.mapbox .hit{fill:transparent;cursor:pointer}
.maptools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0 0;font-size:14px}
.sheet .mapbox{margin-top:6px;border-color:rgba(31,42,68,.3)}

.qa{display:flex;flex-direction:column;gap:8px}
.qa textarea{width:100%;min-height:84px;padding:10px 11px;border-radius:9px;border:1.5px solid rgba(31,42,68,.3);background:#ffffff;color:var(--ink);color-scheme:light;resize:vertical}
.ans{border-left:3px solid var(--cap);padding:2px 0 2px 10px}
.ans b{display:block;font-size:13px;font-weight:600;color:rgba(31,42,68,.7)}
.ans p{margin:0;font-family:var(--font-hand);font-size:23px;line-height:1.12;white-space:pre-wrap}
.ans.wait p{font-family:var(--font-body);font-size:14px;color:rgba(31,42,68,.7)}

#add{position:fixed;right:16px;bottom:18px;z-index:6;border:0;border-radius:99px;padding:14px 20px;background:var(--cap);color:#fff;font-weight:600;font-size:16px;box-shadow:0 10px 24px rgba(229,81,107,.4)}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(31,42,68,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet form{width:min(100%,680px);max-height:92vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;padding:18px 18px 22px;display:flex;flex-direction:column;gap:12px}
@media (min-width:720px){.sheet{align-items:center}.sheet form{border-radius:18px}}
.sheet h2{font-family:var(--font-display);font-weight:500;font-size:24px;margin:0}
.f{display:flex;flex-direction:column;gap:4px}
.f>label,.f>span{font-size:13px;font-weight:600}
.f input[type=text],.f input[type=date],.f textarea,.f select{padding:10px 11px;border-radius:9px;border:1.5px solid rgba(31,42,68,.3);background:#ffffff;color:var(--ink);color-scheme:light;width:100%}
.f textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.one{grid-template-columns:1fr}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs div{position:relative}
.thumbs img{width:68px;height:68px;object-fit:cover;border-radius:6px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#a3331a;color:#fff;font-size:14px;line-height:1;padding:0}
.formmsg{font-size:14px;color:#a3331a;min-height:20px}
.sheet .acts{justify-content:flex-end}
.sheet .acts .btn{padding:10px 16px;font-size:15px}
.pinrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.pinrow .btn{padding:6px 10px;font-size:13px}

.linkbtn{border:0;background:none;padding:0;font-size:13px;color:var(--mist);text-decoration:underline;text-underline-offset:3px}
#gate{position:fixed;inset:0;z-index:40;background:var(--night);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .in{width:min(100%,360px);display:flex;flex-direction:column;gap:14px}
#gate h1{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:40px;line-height:1;margin:0;color:var(--ink)}
#gate form{display:flex;flex-direction:column;gap:10px}
#gate label{font-size:13px;font-weight:600;color:var(--ink)}
#gate input{padding:12px 13px;border-radius:10px;border:1.5px solid #d3dce8;background:#fff;color:var(--ink);font-size:16px;width:100%}
#gate .btn{padding:12px 16px;font-size:16px}
#gatemsg{min-height:22px;font-size:14px;color:#a3331a}
.foot{margin-top:40px;font-size:13px;text-align:center}
#box{position:fixed;inset:0;z-index:30;background:rgba(8,12,10,.95);display:flex;align-items:center;justify-content:center;padding:14px;cursor:zoom-out}
#box img{max-width:100%;max-height:100%;border-radius:6px}
</style>
</head>
<body>
<div id="gate"><div class="in">
  <span class="eyebrow" style="font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--leaf);font-weight:600">Özel pano</span>
  <h1>Anı Panosu</h1>
  <form id="loginform" hidden autocomplete="on">
    <label for="g-eposta">E-posta</label><input id="g-eposta" type="email" autocomplete="username" required>
    <label for="g-sifre">Şifre</label><input id="g-sifre" type="password" autocomplete="current-password" required>
    <button class="btn cap" id="g-giris" type="submit">Giriş yap</button>
  </form>
  <form id="nameform" hidden>
    <label for="g-ad">Panoda görünecek adın</label><input id="g-ad" type="text" maxlength="30" required>
    <button class="btn cap" type="submit">Devam et</button>
  </form>
  <div id="gatemsg" role="status" aria-live="polite">Açılıyor…</div>
  <button class="btn onboard" id="gateout" type="button" hidden>Başka hesapla gir</button>
</div></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Anı panomuz</span>
      <h1 id="cift">Anı Panosu</h1>
    </div>
    <button type="button" id="cikis" class="linkbtn">Çıkış</button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Bölümler"></nav>
  <div class="status" id="status" role="status">Pano açılıyor…</div>
  <main id="main"></main>
  <div class="foot"><button type="button" id="ice" class="linkbtn">Yedek dosyasından içe aktar</button><input type="file" id="icefile" accept="application/json,.json" hidden></div>
</div>
<button id="add" type="button" hidden>+ Yeni kayıt</button>

<div class="sheet" id="sheet" hidden>
  <form id="form" autocomplete="off">
    <h2 id="formtitle">Yeni kayıt</h2>
    <div class="f"><label for="f-tip">Tür</label><select id="f-tip"></select></div>
    <div class="f"><label for="f-baslik" id="l-baslik">Ne yaptık?</label><input type="text" id="f-baslik" maxlength="160" required></div>
    <label class="check" id="wishrow" hidden><input type="checkbox" id="f-istek"> <span id="l-istek"></span></label>
    <label class="check" id="basrow" hidden><input type="checkbox" id="f-bas"> <span>Bu, birlikte olmaya başladığımız gün</span></label>
    <div class="two" id="row2">
      <div class="f" id="tarihbox"><label for="f-tarih" id="l-tarih">Tarih</label><input type="date" id="f-tarih"></div>
      <div class="f" id="yerbox"><label for="f-yer" id="l-yer">Yer</label><input type="text" id="f-yer" maxlength="80" placeholder="İsteğe bağlı"></div>
    </div>
    <div class="f" id="pinbox">
      <span>Haritadaki yeri</span>
      <div class="pinrow"><span id="pinstate"></span>
        <button class="btn ghost" type="button" id="pintoggle">Haritada işaretle</button>
        <button class="btn ghost" type="button" id="pinview" hidden>Dünya haritası</button>
        <button class="btn ghost" type="button" id="pinclear" hidden>İğneyi kaldır</button></div>
      <div class="mapbox" id="pinmap" hidden></div>
    </div>
    <div class="f"><label for="f-not" id="l-not">Not</label><textarea id="f-not" maxlength="2000"></textarea></div>
    <div class="f" id="photorow">
      <span>Fotoğraflar</span>
      <div class="thumbs" id="thumbs"></div>
      <input type="file" id="f-foto" accept="image/*" multiple>
    </div>
    <div class="formmsg" id="formmsg" role="status" aria-live="polite"></div>
    <div class="acts">
      <button class="btn ghost" type="button" id="cancel">Vazgeç</button>
      <button class="btn cap" type="submit" id="save">Kaydet</button>
    </div>
  </form>
</div>
<div id="box" hidden><img id="boximg" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=2"></script>

function refresh(){ clearTimeout(timer); timer = setTimeout(function(){ Object.keys(subs).forEach(function(n){ load(n).catch(function(){}); }); }, 400); }

var A = {
  db: { collection: coll },
  user: {

function b64blob(s){ var bin = atob(s), a = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type:"image/jpeg"}); }
$("ice").addEventListener("click", function(){ $("icefile").click(); });
$("icefile").addEventListener("change", function(){
  var file = this.files && this.files[0]; this.value = ""; if(!file) return;
  var st = $("status"); function say(t){ st.hidden = !t; st.textContent = t || ""; }
  file.text().then(function(txt){
    var j = JSON.parse(txt), have = cache.kayitlar || {}, map = {}, done = 0, added = 0, recs = j.kayitlar || [], chain = Promise.resolve();
    recs.forEach(function(rec){
      chain = chain.then(function(){
        done++; if(have[rec.id]) return;
        say("İçe aktarılıyor: " + done + " / " + recs.length);
        var d = clone(rec.data), fc = Promise.resolve();
        (d.foto || []).forEach(function(f, i){
          if(!(f && f.src && j.foto && j.foto[f.src])) return;
          fc = fc.then(function(){
            if(map[f.src]){ d.foto[i] = {id: map[f.src]}; return; }
            var path = rid() + ".jpg";
            return sb.storage.from("foto").upload(path, b64blob(j.foto[f.src]), {contentType:"image/jpeg"}).then(function(r){ if(r.error) throw r.error; map[f.src] = path; d.foto[i] = {id: path}; });
          });
        });
        return fc.then(function(){ return sb.from("kayitlar").upsert({id: rec.id, data: d, guncel: now()}); }).then(function(r){ if(r.error) throw r.error; added++; });
      });
    });
    (j.sorular || []).forEach(function(rec){ chain = chain.then(function(){ return sb.from("sorular").upsert({id: rec.id, data: rec.data, guncel: now()}); }); });
    return chain.then(function(){ say(added + " kayıt içe aktarıldı."); refresh(); setTimeout(function(){ say(""); }, 6000); });
  }).catch(function(e){ say("İçe aktarma yarıda kaldı: " + (e && e.message || "bilinmeyen hata") + ". Aynı dosyayı tekrar seçersen kaldığı yerden devam eder."); refresh(); });
});

  if(c === "invalid_argument" || c === "not_granted") return "Kaydedilemedi. Bu panoya yazma iznin yok gibi görünüyor.";
  if(c === "revoked") return "Panoya erişimin değişmiş. Sayfayı yeniden aç.";

  Promise.all([C.use("db"), C.use("user"), C.use("assets")]).then(function(r){
    S.db = r[0]; S.user = r[1]; S.assets = r[2];

    var pre = [];
    if(S.user){
      pre.push(Promise.resolve(S.user.id && S.user.id()).then(function(id){ S.uid = id || null; }).catch(function(){}));
      pre.push(Promise.resolve(S.user.can && S.user.can("data.write")).then(function(v){ S.canWrite = v === undefined ? null : v; }).catch(function(){}));
    }

      S.db.collection(COL).onSnapshot(function(snap){
        S.docs = snap.docs.map(function(d){ var o = Object.assign({}, d.data() || {}); o._id = d.id; return o; });

        var m = {}; snap.docs.forEach(function(d){ m[d.id] = d.data() || {}; }); S.qs = m; resolveNames(); if(route() === "soru") render();
      }, function(){});
    });
  });
}

    else { var w = el("div", "ans wait"); w.appendChild(el("p", null, "Diğer cevap henüz gelmedi. Gelince burada görünecek.")); qa.appendChild(w); }
  } else if(S.uid && canEdit()){

    var ta = el("textarea"); ta.id = "soru-cevap"; ta.maxLength = 1200; ta.setAttribute("aria-label", "Cevabın"); ta.placeholder = "Cevabını yaz"; ta.value = S.drafts[ta.id] || "";
    ta.addEventListener("input", function(){ S.drafts[ta.id] = ta.value; });
    ta.addEventListener("focus", function(){ S.focusId = ta.id; }); ta.addEventListener("blur", function(){ if(S.focusId === ta.id) S.focusId = null; });

      var pq = el("div", "qa"); Object.keys(p.c || {}).forEach(function(u){ var o = el("div", "ans"); o.appendChild(el("b", null, nameOf(u))); o.appendChild(el("p", null, p.c[u])); pq.appendChild(o); });
      pc.appendChild(pq); l.appendChild(pc);

}

function renderHarita(main){
  var withPin = S.docs.filter(function(d){ return d.kon && d.kon.length === 2 && (d.durum !== "istek" || d.tip === "yer"); });
  var groups = {}; withPin.forEach(function(d){ var k = pinKey(d.kon); (groups[k] = groups[k] || {key:k, kon:d.kon, items:[]}).items.push(d); });

  var lg = el("div", "legend"), l1 = el("span"), l2 = el("span"); l1.appendChild(el("i")); l1.appendChild(document.createTextNode("Gittik")); l2.appendChild(el("i", "p")); l2.appendChild(document.createTextNode("Gideceğiz")); lg.appendChild(l1); lg.appendChild(l2); main.appendChild(lg);
  if(S.pin && groups[S.pin]) section(main, groups[S.pin].label, groups[S.pin].items.length + " kayıt", groups[S.pin].items.sort(byNew));
  else main.appendChild(el("p", "sec-hint", pins.length ? "Bir iğneye dokununca o yerdeki kayıtlar aşağıda açılır." : ""));

  var h = el("div", "day"); h.style.marginTop = "22px"; h.appendChild(el("h2", null, "Haritaya eklenmeyi bekleyenler")); h.appendChild(el("span", null, rest.length + " kayıt")); main.appendChild(h);
  main.appendChild(el("p", "sec-hint", "Bir kayıtta Düzenle'ye basıp “Haritada işaretle” ile yerini seçince iğnesi haritaya eklenir."));
  if(rest.length){ var l = el("div", "list"); rest.slice(0, 12).forEach(function(d){ l.appendChild(card(d)); }); main.appendChild(l); }
}

function defterList(){
  var f = S.docs.filter(function(d){ return d.durum !== "istek" && (d.tip === "ani" || d.tip === "yer" || d.tip === "lezzet"); });
  var und = f.filter(function(d){ return !d.tarih; }).sort(function(a, b){ return (a.sira || 1e9) - (b.sira || 1e9) || (a.z || 0) - (b.z || 0); });
  var dat = f.filter(function(d){ return d.tarih; }).sort(function(a, b){ return a.tarih.localeCompare(b.tarih) || (a.z || 0) - (b.z || 0); });
  return und.concat(dat);
}
function setPage(id){ S.pageId = id; try{ localStorage.setItem("pano-sayfa", id); }catch(e){} }
function turn(n){
  if(route() !== "akis") return;
  var L = defterList(), i = 0; L.forEach(function(d, k){ if(d._id === S.pageId) i = k; });
  var j = Math.max(0, Math.min(L.length - 1, n === "son" ? L.length - 1 : n === "ilk" ? 0 : i + n));
  if(!L.length || j === i) return; setPage(L[j]._id); S.confirmDel = null; render(); window.scrollTo(0, 0);
}
function pager(i, N){
  var p = el("div", "pager"), a = el("button", "btn onboard", "‹ Önceki"), b = el("button", "btn onboard", "Sonraki ›"), m = el("div", "mid");
  a.type = b.type = "button"; a.disabled = i === 0; b.disabled = i === N - 1;
  a.addEventListener("click", function(){ turn(-1); }); b.addEventListener("click", function(){ turn(1); });
  m.appendChild(el("span", null, "Sayfa " + (i + 1) + " / " + N));
  var j = el("button", null, i === N - 1 ? "İlk sayfa" : "Son sayfa"); j.type = "button"; j.addEventListener("click", function(){ turn(i === N - 1 ? "ilk" : "son"); }); m.appendChild(j);
  p.appendChild(a); p.appendChild(m); p.appendChild(b); return p;
}
function renderDefter(main){
  var L = defterList();
  if(!L.length){ main.appendChild(el("div", "empty", "Defter boş. İlk sayfayı “Yeni kayıt” ile ekleyin; her anı kendi sayfasında durur.")); return; }
  var i = 0; L.forEach(function(d, k){ if(d._id === S.pageId) i = k; });
  var d = L[i];
  main.appendChild(pager(i, L.length));
  var h = el("div", "day"); h.style.marginTop = "6px"; h.appendChild(el("h2", null, d.tarih ? niceDate(d.tarih, true) : "Tarihi yazılmamış")); h.appendChild(el("span", null, d.tarih ? weekday(d.tarih) : "Düzenle ile tarih ekleyebilirsin")); main.appendChild(h);
  var c = card(d); c.classList.add("page"); main.appendChild(c);
  var x0 = null;
  c.addEventListener("pointerdown", function(e){ x0 = e.target.closest("input,textarea,button,select") ? null : e.clientX; });
  c.addEventListener("pointerup", function(e){ if(x0 == null) return; var dx = e.clientX - x0; x0 = null; if(Math.abs(dx) > 70) turn(dx < 0 ? 1 : -1); });
  c.addEventListener("pointercancel", function(){ x0 = null; });
  main.appendChild(pager(i, L.length));
}
function renderFoto(main){
  var items = []; defterList().forEach(function(d){ (d.foto || []).forEach(function(f){ if(photoSrc(f)) items.push({d:d, f:f}); }); });
  var h = el("div", "day"); h.appendChild(el("h2", null, "Fotoğraflar")); h.appendChild(el("span", null, items.length + " fotoğraf")); main.appendChild(h);
  if(!items.length){ main.appendChild(el("div", "empty", "Henüz fotoğraf yok. Anı defterine fotoğraflı bir sayfa ekleyince burada görünür.")); return; }
  main.appendChild(el("p", "sec-hint", "Eskiden yeniye sıralı. Bir fotoğrafa dokununca defterdeki sayfası açılır."));
  var g = el("div", "grid3");
  items.forEach(function(it){
    var b = el("button"); b.type = "button"; b.setAttribute("aria-label", (it.d.baslik || "Anı") + " sayfasını aç");

    b.appendChild(im); b.addEventListener("click", function(){ setPage(it.d._id); location.hash = "#akis"; }); g.appendChild(b);
  });
  main.appendChild(g);
}

function renderX(main){
  var d = S.docs.filter(function(x){ return x._id === "x-sayac"; })[0], n = d ? d.n || 0 : 0;
  var t = el("div", "together"); t.appendChild(el("b", null, String(n))); t.appendChild(el("span", null, "Toplam X")); main.appendChild(t);

  function bump(k){ write("x-sayac", function(){ return d ? ref("x-sayac").update({n: Math.max(0, n + k)}) : ref("x-sayac").set({tip:"sayac", n: Math.max(0, k)}); }); }
  plus.addEventListener("click", function(){ bump(1); }); minus.addEventListener("click", function(){ bump(-1); }); minus.disabled = n === 0;

function render(){
  var r = route(), main = $("main"), keepY = window.scrollY;
  renderTabs(r);
  $("add").hidden = !(S.loaded && canEdit()) || r === "soru" || r === "x";
  main.textContent = "";
  if(!S.loaded) return;
  var all = S.docs;
  if(r === "akis"){ renderDefter(main);
  } else if(r === "fotograflar"){ renderFoto(main);
  } else if(r === "soru"){ renderSoru(main);
  } else if(r === "x"){ renderX(main);
  } else if(r === "harita"){ renderHarita(main);
  } else if(r === "yapilacaklar"){
    var todo = all.filter(function(d){ return d.tip === "yapilacak"; }).sort(function(a, b){ return (b.z || 0) - (a.z || 0); });
    section(main, "Birlikte yapacaklarımız", todo.length + " madde", todo, "Liste boş. Birlikte yapmak istediğiniz ilk şeyi ekleyin: bir konser, bir kamp, yeni bir tarif.", "“Yaptık” dediğiniz madde bugünün tarihiyle Anı defteri'ne yeni sayfa olarak eklenir.");
  } else if(r === "ozel-gunler"){
    var gl = all.filter(function(d){ return d.tip === "gun" && d.tarih; });
    var bas = gl.filter(function(d){ return d.bas; })[0];
    if(bas){ var tg = el("div", "together"), n = dayNo(new Date()) - dayNo(parse(bas.tarih)) + 1;
      tg.appendChild(el("b", null, String(Math.max(n, 1)))); tg.appendChild(el("span", null, "Birlikte " + Math.max(n, 1) + ". günümüz. Başlangıç: " + niceDate(bas.tarih, true))); main.appendChild(tg); }
    gl.sort(function(a, b){ return nextOf(a.tarih).days - nextOf(b.tarih).days; });
    section(main, "Özel günlerimiz", gl.length + " gün", gl, "Henüz özel gün eklenmedi. Tanışma gününüzü, doğum günlerini ve yıl dönümlerini ekleyin.", bas ? "En yakın gün en üstte." : "Birlikte olmaya başladığınız günü ekleyip işaretlerseniz burada gün sayacı görünür.");
  } else {
    var tip = TABTIP[r], t = T[tip];
    var mine = all.filter(function(d){ return d.tip === tip; });
    var doneL = mine.filter(function(d){ return d.durum !== "istek"; }).sort(byNew), wish = mine.filter(function(d){ return d.durum === "istek"; }).sort(function(a, b){ return (a.tarih || "9").localeCompare(b.tarih || "9") || (b.z || 0) - (a.z || 0); });
    section(main, t.h1, doneL.length + " kayıt", doneL, t.e1);
    if(t.wish) section(main, t.h2, wish.length + " kayıt", wish, t.e2);
  }
  window.scrollTo(0, keepY);
  if(S.focusId){ var fi = $(S.focusId); if(fi){ fi.focus(); try{ fi.setSelectionRange(fi.value.length, fi.value.length); }catch(e){} } }
}
window.addEventListener("hashchange", function(){
  window.scrollTo(0, 0); S.pin = null; render();
  var a = $("t-" + route()); if(a && a.scrollIntoView) a.scrollIntoView({block:"nearest", inline:"center"});
});

/* ---------- add / edit form ---------- */
var F = { editing:null, keep:[], kon:null, view:"tr", open:false };
Object.keys(T).forEach(function(k){ var o = el("option", null, T[k].ad); o.value = k; $("f-tip").appendChild(o); });
function tipNow(){ return $("f-tip").value || "ani"; }
function drawPin(){
  $("pinstate").textContent = F.kon ? "İğne yerleştirildi." : "Henüz işaretlenmedi.";
  $("pinclear").hidden = !F.kon; $("pinview").hidden = !F.open; $("pinmap").hidden = !F.open;
  $("pintoggle").textContent = F.open ? "Haritayı kapat" : F.kon ? "İğneyi değiştir" : "Haritada işaretle";
  $("pinview").textContent = F.view === "tr" ? "Dünya haritası" : "Türkiye haritası";
  var m = $("pinmap"); m.textContent = "";
  if(F.open) m.appendChild(mapSvg(F.view, F.kon ? [{key:"x", kon:F.kon}] : [], "x", null, function(k){ F.kon = k; drawPin(); }));
}
$("pintoggle").addEventListener("click", function(){ F.open = !F.open; if(F.open && F.kon && !inTR(F.kon)) F.view = "world"; drawPin(); });
$("pinview").addEventListener("click", function(){ F.view = F.view === "tr" ? "world" : "tr"; drawPin(); });
$("pinclear").addEventListener("click", function(){ F.kon = null; drawPin(); });
function syncForm(){
  var t = T[tipNow()];
  $("l-baslik").textContent = t.l;
  $("wishrow").hidden = !t.wish; $("l-istek").textContent = t.wish || "";
  $("basrow").hidden = tipNow() !== "gun";
  $("tarihbox").hidden = !!t.noDate; $("yerbox").hidden = !t.yerL; $("l-yer").textContent = t.yerL || "Yer";
  $("row2").hidden = !!t.noDate && !t.yerL; $("row2").className = "two" + (t.noDate || !t.yerL ? " one" : "");
  $("l-tarih").textContent = tipNow() === "gun" ? "Tarih (ilk yılıyla)" : tipNow() === "yer" && $("f-istek").checked ? "Ne zaman gideceğiz?" : "Tarih";
  $("l-not").textContent = t.notL || "Not";
  $("pinbox").hidden = !t.pin;
  $("photorow").hidden = !!t.noFoto || (!S.assets && !F.keep.length);
  $("f-foto").hidden = !S.assets;
}
$("f-tip").addEventListener("change", syncForm);
$("f-istek").addEventListener("change", function(){ if($("f-istek").checked) $("f-tarih").value = ""; syncForm(); });
function drawThumbs(){
  var t = $("thumbs"); t.textContent = "";
  F.keep.forEach(function(f, i){
    var w = el("div"), im = el("img"); im.alt = ""; im.src = photoSrc(f);
    var x = el("button", null, "×"); x.type = "button"; x.setAttribute("aria-label", "Fotoğrafı kayıttan çıkar");
    x.addEventListener("click", function(){ F.keep.splice(i, 1); drawThumbs(); });

  });
}
function openForm(d){
  F.editing = d || null; F.keep = d ? (d.foto || []).slice() : []; F.kon = d && d.kon ? d.kon.slice() : null; F.open = false; F.view = "tr";
  $("formtitle").textContent = d ? "Kaydı düzenle" : "Yeni kayıt";
  var r = route(), t = d ? d.tip || "ani" : r === "harita" ? "yer" : TABTIP[r] || "ani";
  $("f-tip").value = t;
  $("f-baslik").value = d ? d.baslik || "" : ""; $("f-tarih").value = d ? d.tarih || "" : t === "gun" ? "" : today();
  $("f-yer").value = d ? d.yer || "" : ""; $("f-not").value = d ? d.not || "" : "";
  $("f-istek").checked = !!d && d.durum === "istek"; $("f-bas").checked = !!d && !!d.bas; $("f-foto").value = ""; $("formmsg").textContent = "";
  $("save").disabled = false; $("save").textContent = "Kaydet";
  drawThumbs(); drawPin(); syncForm(); $("sheet").hidden = false; $("f-baslik").focus();
}
function closeForm(){ $("sheet").hidden = true; }
$("add").addEventListener("click", function(){ openForm(null); });
$("cancel").addEventListener("click", closeForm);
$("sheet").addEventListener("click", function(e){ if(e.target === $("sheet")) closeForm(); });

function shrink(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function(){
      var m = 1600, s = Math.min(1, m / Math.max(im.naturalWidth, im.naturalHeight));
      var c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ b ? resolve(b) : reject({code:"unsupported_type"}); }, "image/jpeg", 0.84);
    };
    im.onerror = function(){ URL.revokeObjectURL(url); reject({code:"unsupported_type"}); };
    im.src = url;
  });
}
$("form").addEventListener("submit", function(e){
  e.preventDefault();
  var baslik = $("f-baslik").value.trim(); if(!baslik){ $("formmsg").textContent = "Bir başlık yaz."; return; }
  var tip = tipNow(), t = T[tip];
  if(tip === "gun" && !$("f-tarih").value){ $("formmsg").textContent = "Özel günün tarihini seç."; return; }
  var files = S.assets && !t.noFoto ? Array.prototype.slice.call($("f-foto").files || []) : [];
  var btn = $("save"); btn.disabled = true; btn.textContent = files.length ? "Fotoğraflar yükleniyor…" : "Kaydediliyor…"; $("formmsg").textContent = "";
  var foto = t.noFoto ? [] : F.keep.slice(), chain = Promise.resolve();
  files.forEach(function(file){
    chain = chain.then(function(){ return shrink(file); }).then(function(b){ return S.assets.upload(b, {type:"image/jpeg"}); }).then(function(r){ foto.push({id:r.id}); });
  });
  chain.then(function(){
    var istek = tip === "yapilacak" || (!!t.wish && $("f-istek").checked);
    var data = { tip:tip, baslik:baslik, tarih: t.noDate || (istek && tip !== "yer") ? "" : $("f-tarih").value || "", yer: t.yerL ? $("f-yer").value.trim() : "", not:$("f-not").value.trim(),
                 durum: istek ? "istek" : "oldu", foto:foto, kon: t.pin && F.kon ? F.kon : null, bas: tip === "gun" && $("f-bas").checked };
    if(F.editing) return ref(F.editing._id).update(data);
    data.ekleyen = S.uid || null; data.z = Date.now(); data.yorumlar = []; data.yildiz = {};
    var nr = S.db.collection(COL).doc(); if(!istek && (tip === "ani" || tip === "yer" || tip === "lezzet")) setPage(nr.id);
    return nr.set(data);
  }).then(function(){
    closeForm();
    var want = t.tab, r = route();
    if(!F.editing && r !== want && !(r === "akis" && want !== "yapilacaklar" && want !== "ozel-gunler") && !(r === "harita")) location.hash = "#" + want;
  }).catch(function(err){
    if(err && err.code === "invalid_argument") S.canWrite = false;
    $("formmsg").textContent = errText(err); btn.disabled = false; btn.textContent = "Kaydet";
  });
});

$("box").addEventListener("click", function(){ $("box").hidden = true; });
document.addEventListener("keydown", function(e){
  if((e.key === "ArrowRight" || e.key === "ArrowLeft") && $("sheet").hidden && $("box").hidden && !(e.target.closest && e.target.closest("input,textarea,select"))){ turn(e.key === "ArrowRight" ? 1 : -1); return; }
  if(e.key === "Escape"){ if(!$("box").hidden) $("box").hidden = true; else if(!$("sheet").hidden) closeForm(); } });

try{ S.pageId = localStorage.getItem("pano-sayfa"); }catch(e){}
render(); start();
})();
